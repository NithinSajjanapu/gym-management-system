<!DOCTYPE html>
<html>
<head>
  <title>Expiry Management</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Main Container -->
    <div class="container">

    <!-- Page Title -->
    <h2>⏰ EXPIRY MANAGEMENT</h2>

    <!-- Search -->
    <input
        class="form-control my-3"
        placeholder="Search Name / Phone"
        onkeyup="searchMembers(this.value)"
    >

    <!-- Filter Section -->
    <div class="filter-grid four-three">

        <button class="btn btn-warning btn-sm" onclick="applyFilter('5')">5 Days</button>
        <button class="btn btn-warning btn-sm" onclick="applyFilter('3')">3 Days</button>
        <button class="btn btn-warning btn-sm" onclick="applyFilter('2')">2 Days</button>
        <button class="btn btn-warning btn-sm" onclick="applyFilter('1')">1 Day</button>

        <div class="filter-break">
        <button class="btn btn-info btn-sm" onclick="applyFilter('today')">Today</button>
        <button class="btn btn-danger btn-sm" onclick="applyFilter('expired')">Expired</button>
        <button class="btn btn-success btn-sm" onclick="applyFilter('')">All</button>
        </div>

    </div>

    <!-- Members List -->
    <div class="row" id="membersContainer"></div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
    <a href="dashboard.html"><span>⌂</span>Home</a>
    <a href="members.html"><span>☷</span>Members</a>
    <a class="add-action" href="add-member.html"><span>+</span></a>
    <a class="active-link" href="expiry.html"><span>◴</span>Expiry</a>
    <a href="dashboard.html#transactionBox"><span>≡</span>More</a>
    </nav>

    <!-- MEMBER MODAL -->
    <div class="modal fade" id="memberModal">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

        <!-- Modal Header -->
        <div class="modal-header">

            <h5 class="modal-title">Member Details</h5>

            <button
            type="button"
            class="modal-back-btn"
            data-bs-dismiss="modal"
            >
            ✕
            </button>

        </div>

        <!-- Modal Body -->
        <div class="modal-body" id="modalContent"></div>

        </div>

    </div>

    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- API -->
    <script src="../assets/js/api.js"></script>

    <script>
        const memberModalEl = document.getElementById("memberModal");
        const bottomNav = document.querySelector(".bottom-nav");

        memberModalEl.addEventListener("show.bs.modal", () => {
        bottomNav.classList.add("hide-nav");
        });

        memberModalEl.addEventListener("hidden.bs.modal", () => {
        bottomNav.classList.remove("hide-nav");
        });
    </script>

    <script>
        //Token 
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
        }

        //Global states

        let members = [];
        let currentFilter = "";
        let selectedMember = null;

       //Date helpers

        function isToday(date){
        const d = new Date(date);
        const today = new Date();
        return d.toDateString() === today.toDateString();
        }

        //Whatsapp message Templetes

        function formatMessage(m){

        if(m.daysRemaining < 0){
            return `Hello ${m.name},

        Your Veer Fitness Club membership has expired.

        Expired On: ${new Date(m.endDate).toLocaleDateString()}

        Please renew your plan to continue training without interruption. We will be happy to help you restart today.`;
        }

        return `Hello ${m.name},

        Your Veer Fitness Club membership is expiring in ${m.daysRemaining} day(s).

        Expiry Date: ${new Date(m.endDate).toLocaleDateString()}

        Please renew soon to continue your fitness journey without a break.`;
        }

       //Whatsapp action

        function openWhatsapp(m){
        const phone = m.phone;
        const text = encodeURIComponent(formatMessage(m));
        const url = `https://wa.me/91${phone}?text=${text}`;
        window.open(url, "_blank");
        }

        //Load members

        async function loadExpiryMembers(){

        const res = await fetch(
            "https://gym-management-system-bjcd.onrender.com/api/members/expiry-list",
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (res.status === 401) {
            localStorage.removeItem("token");
            location.href = "login.html";
            return;
        }
        let data = await res.json();

        data.sort((a,b)=> a.daysRemaining - b.daysRemaining);

        members = data;
        applyLocalFilter();
        }

       //Handling filters

        function applyFilter(filter){
        currentFilter = filter;
        applyLocalFilter();
        }

        function applyLocalFilter(){

        let data = [...members];

        if(currentFilter === "expired"){
            data = data.filter(m => m.daysRemaining < 0);
        }
        else if(currentFilter === "today"){
            data = data.filter(m => isToday(m.endDate));
        }
        else if(currentFilter){
            data = data.filter(m => m.daysRemaining == currentFilter);
        }

        renderCards(data);
        }

        //UI-rendering

        function renderCards(data){

        let html = "";

        data.forEach(m => {

            const photo = m.photoUrl && m.photoUrl.startsWith("http")
            ? m.photoUrl
            : "https://via.placeholder.com/100";

            let badgeClass =
            m.daysRemaining < 0 ? "expired" :
            m.daysRemaining <= 2 ? "expiring" : "active";

            let badgeText =
            m.daysRemaining < 0 ? "EXPIRED" : `${m.daysRemaining} Days Left`;

            const canWhatsapp = m.daysRemaining <= 2;

            html += `
            <div class="col-md-4 mb-4">

                <div class="member-card ${m.daysRemaining < 0 ? "expired-card" : ""}"
                onclick="showMember('${m._id}')">

                <div class="card-top">

                    <img src="${photo}" class="member-photo">

                    <div>
                    <div class="card-title">${m.name}</div>
                    <div class="card-sub">${m.phone}</div>
                    </div>

                    <span class="days-badge ${badgeClass}">
                    ${badgeText}
                    </span>

                </div>

                <div class="card-box">
                    <div>📦 Plan      : ${m.plan} M</div>
                    <div>📅 Start     : ${new Date(m.startDate).toLocaleDateString()}</div>
                    <div>📅 End       : ${new Date(m.endDate).toLocaleDateString()}</div>
                    <div>⏳ Remaining : ${m.daysRemaining} days</div>
                </div>

                ${
                    canWhatsapp
                    ? `<button class="btn btn-success w-100 mt-2"
                        onclick="event.stopPropagation();openWhatsapp(${JSON.stringify(m).replace(/"/g,'&quot;')})">
                        WhatsApp Reminder
                        </button>`
                    : ""
                }

                </div>

            </div>
            `;
        });

        document.getElementById("membersContainer").innerHTML = html;
        }

        //Modal view 

        async function showMember(id){
        const res = await fetch(
            `https://gym-management-system-bjcd.onrender.com/api/members/${id}`,
            {
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }
        );

        if (res.status === 401) {
            localStorage.removeItem("token");
            location.href = "login.html";
            return;
        }
        const m = await res.json();

        selectedMember = m;

        const photo = m.photoUrl || "https://via.placeholder.com/150";

        const today = new Date();
        const end = new Date(m.endDate);

        today.setHours(0,0,0,0);
        end.setHours(0,0,0,0);

        const days = Math.ceil((end - today) / (1000 * 60 * 60 * 24));
        const canWhatsapp = days <= 2;

        document.getElementById("modalContent").innerHTML = `

            <center>
            <img 
                src="${m.photo}"
                onerror="this.src='https://via.placeholder.com/150'"
                style="width:150px;height:150px;border-radius:50%;border:4px solid gold;">
            </center>
            

            <br>

            <table class="table table-dark">

            <tr><th>Name</th><td>${m.name}</td></tr>
            <tr><th>Phone</th><td>${m.phone}</td></tr>
            <tr><th>Age</th><td>${m.age}</td></tr>
            <tr><th>Weight</th><td>${m.weight || "-"}</td></tr>
            <tr><th>Gender</th><td>${m.gender}</td></tr>
            <tr><th>Workout Type</th><td>${m.workoutType}</td></tr>
            <tr><th>Plan</th><td>${m.plan}</td></tr>
            <tr><th>Amount</th><td>₹${m.amount}</td></tr>
            <tr><th>Status</th><td>${m.status}</td></tr>
            <tr><th>Start Date</th><td>${new Date(m.startDate).toLocaleDateString()}</td></tr>
            <tr><th>Expiry Date</th><td>${new Date(m.endDate).toLocaleDateString()}</td></tr>

            </table>

            ${
            canWhatsapp
                ? `<button class="btn btn-success w-100 mb-2"
                    onclick='openWhatsapp(${JSON.stringify(m).replace(/"/g,"&quot;")})'>
                    WhatsApp Reminder
                </button>`
                : ""
            }

            <button class="btn btn-warning w-100 mb-2" onclick="renewMember()">
            Renew Membership
            </button>

            <button class="btn btn-danger w-100" onclick="removeMember('${m._id}')">
            Delete Member
            </button>

        `;

        new bootstrap.Modal(document.getElementById("memberModal")).show();
        }

        //Renew Member option 

        function renewMember(){
        if (selectedMember) {
            sessionStorage.setItem("renewMember", JSON.stringify(selectedMember));
        }
        location.href = "./add-member.html?renew=true";
        }

        //Delete member option  
        
        async function removeMember(id){

        const ok = confirm("Are you sure you want to delete this member?");
        if (!ok) return;

        const res = await fetch(
        `https://gym-management-system-bjcd.onrender.com/api/members/${id}`,
        {
            method:"DELETE",
            headers:{
                Authorization:`Bearer ${token}`
            }
        });

        if(res.status===401){
            localStorage.removeItem("token");
            location.href="login.html";
            return;
        }

        const result = await res.json();

        alert(result.message || "Member deleted");

        const modal = bootstrap.Modal.getInstance(document.getElementById("memberModal"));

        if (modal) modal.hide();

        loadExpiryMembers();
        }

        //INIT
        loadExpiryMembers();

    </script>

</body>
</html>
