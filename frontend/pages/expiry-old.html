<!DOCTYPE html>
<html>
<head>
  <title>Expiry Management</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      margin: 0;
      font-family: Arial;

      background: url("https://images.unsplash.com/photo-1517963879433-6ad2b056d712?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.65);
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
    }

    h3 {
      text-align: center;
      color: gold;
      font-weight: 900;
      margin-top: 20px;
    }

    /* FILTER BUTTONS */
    .filter-bar {
      text-align: center;
      margin: 20px 0;
    }

    .filter-bar button {
      margin: 3px;
      border-radius: 20px;
      font-weight: bold;
      transition: 0.3s;
    }

    .filter-bar button:hover {
      transform: scale(1.05);
    }

    /* MEMBER CARD */
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);

      border-radius: 16px;
      padding: 15px;
      margin-bottom: 12px;

      border: 1px solid rgba(255,215,0,0.2);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 15px gold;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
      color: gold;
    }

    .phone {
      color: #ccc;
      font-size: 14px;
    }

    /* BADGE */
    .badge-exp {
      background: linear-gradient(45deg, #ffb300, #ff8800);
      color: black;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
    }

    /* BUTTONS */
    .btn-wa {
      background: #25D366;
      color: white;
      font-weight: bold;
      border-radius: 10px;
    }

    .btn-pay {
      background: linear-gradient(45deg, #ffd700, #ffb300);
      color: black;
      font-weight: bold;
      border-radius: 10px;
    }

  </style>
</head>

<body>

<div class="overlay"></div>

<div class="container mt-3">

  <h3>⏰ EXPIRY MANAGEMENT PANEL</h3>

  <!-- FILTER -->
  <div class="filter-bar">
    <button class="btn btn-outline-warning btn-sm">5 Days</button>
    <button class="btn btn-outline-warning btn-sm">3 Days</button>
    <button class="btn btn-outline-warning btn-sm">2 Days</button>
    <button class="btn btn-outline-warning btn-sm">1 Day</button>
    <button class="btn btn-outline-danger btn-sm">Expired</button>
  </div>

  <!-- LIST -->
  <!-- LIST -->
<div id="list"></div>

<!-- MEMBER DETAILS MODAL -->

<div class="modal fade"
     id="memberModal"
     tabindex="-1">

  <div class="modal-dialog">

    <div class="modal-content bg-dark text-white">

      <div class="modal-header">

        <h5 class="modal-title">
          Member Details
        </h5>

        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="modal">
        </button>

      </div>

      <div
        class="modal-body"
        id="modalBody">
      </div>

    </div>

  </div>



</div>

</div>

<script>
console.log("SCRIPT STARTED");
let currentFilter = "";


async function loadExpiryMembers(){

  console.log("LOAD START");

  let url =
  "http://localhost:5000/api/members/expiry-list";

  const res = await fetch(url);

  console.log("FETCH DONE");

  const members = await res.json();

  console.log("MEMBERS =", members);

  render(members);

  console.log("RENDER CALLED");
}


function render(members){

  console.log("RENDER RUNNING");

  let html = "";

  members.forEach(function(m){

    html += `
      <div class="card">

        <div class="name">
          ${m.name}
        </div>

        <div class="phone">
          ${m.phone}
        </div>

        <div class="badge-exp">
          ${m.daysRemaining} Days
        </div>

      </div>
    `;
  });

  console.log("HTML CREATED");

  document.getElementById("list").innerHTML = html;

  console.log("LIST UPDATED");
}

async function sendWhatsapp(id){

 await fetch(

 `http://localhost:5000/api/members/${id}/send-whatsapp`,

 {
   method:"POST"
 }

 );

 alert("WhatsApp Sent");

}



//n

async function viewMember(id){

  const res = await fetch(
    `http://localhost:5000/api/members/${id}`
  );

  const member = await res.json();

  sessionStorage.setItem(
    "renewMember",
    JSON.stringify(member)
  );

  document.getElementById("modalBody").innerHTML = `

    <center>

      <img
        src="http://localhost:5000${member.photo}"
        style="
          width:150px;
          height:180px;
          object-fit:cover;
          border-radius:10px;
        ">

      <h4 class="mt-3">
        ${member.name}
      </h4>

    </center>

    <hr>

    <p><b>Phone:</b> ${member.phone}</p>
    <p><b>Age:</b> ${member.age}</p>
    <p><b>Weight:</b> ${member.weight}</p>
    <p><b>Gender:</b> ${member.gender}</p>
    <p><b>Plan:</b> ${member.plan}</p>
    <p><b>Workout:</b> ${member.workoutType}</p>

    <button
      class="btn btn-warning w-100"
      onclick="renewMember()">

      Renew Membership

    </button>

  `;

  new bootstrap.Modal(
    document.getElementById("memberModal")
  ).show();

}



function renewMember(){

  location.href =
    "./add-member.html?renew=true";

}

//temp



console.log("BEFORE LOAD");

loadExpiryMembers();

console.log("AFTER LOAD");

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
