<!DOCTYPE html>
<html>

<head>
    <title>Members List</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body>

    <div class="overlay"></div>

    <div class="container">

        <!-- Page Title -->
        <h2>👥 MEMBERS LIST</h2>

        <!-- Search -->
        <input
            type="text"
            class="form-control my-3"
            placeholder="Search Name / Phone"
            onkeyup="searchMembers(this.value)"
        >

        <!-- Filter Buttons -->
        <div class="filter-grid three">

            <button
                class="btn btn-primary btn-sm"
                id="filterAll"
                onclick="setMemberFilter('all')"
            >
                All
            </button>

            <button
                class="btn btn-success btn-sm"
                id="filterActive"
                onclick="setMemberFilter('active')"
            >
                Active
            </button>

            <button
                class="btn btn-danger btn-sm"
                id="filterExpired"
                onclick="setMemberFilter('expired')"
            >
                Expired
            </button>

        </div>

        <!-- Members Grid -->
        <div class="row" id="membersContainer"></div>

    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="dashboard.html"><span>⌂</span>Home</a>

        <a class="active-link" href="members.html"><span>☷</span>Members</a>

        <a class="add-action" href="add-member.html"><span>+</span></a>

        <a href="expiry.html"><span>◴</span>Expiry</a>

        <a href="dashboard.html#transactionBox"><span>≡</span>More</a>

    </nav>

    <!-- Member Modal -->
    <div class="modal fade" id="memberModal">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <!-- Modal Header -->
                <div class="modal-header">

                    <h5 class="modal-title">Member Details</h5>

                    <button
                        type="button"
                        class="modal-back-btn"
                        data-bs-dismiss="modal"
                    >
                        ✕
                    </button>

                </div>

                <!-- Modal Body -->
                <div class="modal-body" id="modalContent"></div>

            </div>

        </div>

    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>

    <script>

        const memberModalEl = document.getElementById("memberModal");
        const bottomNav = document.querySelector(".bottom-nav");

        // Hide bottom navigation when modal opens
        memberModalEl.addEventListener("show.bs.modal", () => {
            bottomNav.classList.add("hide-nav");
        });

        // Show bottom navigation when modal closes
        memberModalEl.addEventListener("hidden.bs.modal", () => {
            bottomNav.classList.remove("hide-nav");
        });

    </script>

    <script>
        //Token 
        const token = localStorage.getItem("token");

        if (!token) {
            window.location.href = "login.html";
            throw new Error("Unauthorixed");
        }
        
        // State
        let members = [];
        let currentMemberFilter = "all";
        let currentSearch = "";

        // Load members
        async function loadMembers() {

            members = await getMembers();

            const params = new URLSearchParams(location.search);
            const filter = params.get("filter");

            if (["all", "active", "expired"].includes(filter)) {
                currentMemberFilter = filter;
            }

            applyMemberFilters();
        }

        // Format date
        function formatDate(dateValue) {

            const d = new Date(dateValue);

            if (isNaN(d)) return "-";

            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();

            return `${day}/${month}/${year}`;
        }

        // Check expiry
        function isExpiredMember(member) {

            if (member.status === "EXPIRED") return true;

            const end = new Date(member.endDate);
            const today = new Date();

            if (isNaN(end)) return false;

            today.setHours(0, 0, 0, 0);
            end.setHours(0, 0, 0, 0);

            return end < today;
        }

        // Set filter
        function setMemberFilter(filter) {

            currentMemberFilter = filter;

            const url = new URL(location.href);
            url.searchParams.set("filter", filter);

            history.replaceState(null, "", url);

            applyMemberFilters();
        }

        // Update filter button UI
        function updateFilterButtons() {

            const map = {
                all: "filterAll",
                active: "filterActive",
                expired: "filterExpired"
            };

            Object.entries(map).forEach(([filter, id]) => {

                const btn = document.getElementById(id);

                if (!btn) return;

                btn.classList.toggle(
                    "active-link",
                    currentMemberFilter === filter
                );

                btn.style.opacity =
                    currentMemberFilter === filter ? "1" : ".72";
            });
        }

        // Apply filters
        function applyMemberFilters() {

            let filtered = [...members];

            if (currentMemberFilter === "active") {
                filtered = filtered.filter(m => !isExpiredMember(m));
            }

            if (currentMemberFilter === "expired") {
                filtered = filtered.filter(isExpiredMember);
            }

            if (currentSearch) {

                const value = currentSearch.toLowerCase();

                filtered = filtered.filter(m =>
                    (m.name || "").toLowerCase().includes(value) ||
                    (m.phone || "").includes(currentSearch)
                );
            }

            updateFilterButtons();
            renderCards(filtered);
        }

        // Render member cards
        function renderCards(data) {

            let html = "";

            data.forEach(m => {

                const photo = m.photoUrl || "https://via.placeholder.com/100";

                html += `
                    <div class="col-md-4 mb-4">

                        <div class="member-card" onclick='showMember(${JSON.stringify(m)})'>

                            <div class="card-top">

                                <img
                                    src="${photo}"
                                    onerror="this.src='https://via.placeholder.com/100'"
                                    class="member-photo"
                                >

                                <div>
                                    <div class="card-title">${m.name}</div>
                                    <div class="card-sub">${m.phone}</div>
                                </div>

                                <span class="status ${m.status === "ACTIVE" ? "active" : "inactive"}">
                                    ${m.status}
                                </span>

                            </div>

                            <div class="card-box">

                                <div>📦 Plan : ${m.plan}</div>
                                <div>📅 Start : ${formatDate(m.startDate)}</div>
                                <div>📅 End : ${formatDate(m.endDate)}</div>

                            </div>

                        </div>

                    </div>
                `;
            });

            document.getElementById("membersContainer").innerHTML = html;
        }

        // Show member modal
        function showMember(m) {

            const photo = m.photoUrl || "https://via.placeholder.com/150";

            document.getElementById("modalContent").innerHTML = `

                <div class="member-profile">

                    <img
                        src="${photo}"
                        onerror="this.src='https://via.placeholder.com/150'"
                        alt="${m.name}"
                    >

                    <h4>${m.name}</h4>
                    <p>${m.phone}</p>

                </div>

                <table class="table table-dark details-table">

                    <tr><th>Age</th><td>${m.age}</td></tr>
                    <tr><th>Weight</th><td>${m.weight || "-"}</td></tr>
                    <tr><th>Gender</th><td>${m.gender}</td></tr>
                    <tr><th>Workout</th><td>${m.workoutType}</td></tr>
                    <tr><th>Plan</th><td>${m.plan}</td></tr>
                    <tr><th>Amount</th><td>₹${m.amount}</td></tr>
                    <tr><th>Status</th><td>${m.status}</td></tr>
                    <tr><th>Start Date</th><td>${formatDate(m.startDate)}</td></tr>
                    <tr><th>Expiry Date</th><td>${formatDate(m.endDate)}</td></tr>

                </table>

                <button
                    class="btn btn-danger"
                    onclick="removeMember('${m._id}')"
                >
                    Delete Member
                </button>

            `;

            new bootstrap.Modal(
                document.getElementById("memberModal")
            ).show();
        }

        // Delete member
        async function removeMember(id) {

            const ok = confirm("Are you sure you want to delete this member?");

            if (!ok) return;

            try {

                const result = await deleteMember(id);

                alert(result.message || "Member Deleted");

                bootstrap.Modal
                    .getInstance(document.getElementById("memberModal"))
                    .hide();

                loadMembers();

            } catch (err) {

                console.error(err);
                alert("Delete Failed");
            }
        }

        // Search members
        function searchMembers(value) {

            currentSearch = value.trim();

            applyMemberFilters();
        }

        loadMembers();

    </script>

</body>

</html>
