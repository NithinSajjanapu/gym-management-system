<!DOCTYPE html>
<html>
<head>
  <title>Add Member</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: white;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(3px);
      z-index: -1;
    }
    .container-box {
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }
    .card-box {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 25px;
      border: 1px solid rgba(255,215,0,0.3);
    }
    h3 {
      text-align: center;
      color: gold;
      font-weight: 900;
      margin-bottom: 20px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.3);
      color: white;
    }
    option {
      background: #111827;
      color: white;
    }
    input::placeholder {
      color: #ddd;
    }
    input:focus, select:focus {
      border: 1px solid gold;
      box-shadow: 0 0 10px gold;
    }
    .photo-frame {
      width: 160px;
      height: 200px;
      margin: auto;
      border: 2px dashed gold;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
    }
    .photo-frame video,
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .btn-gold {
      background: linear-gradient(45deg, #ffd700, #ffb300);
      color: black;
      font-weight: bold;
      border: none;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      margin-top: 10px;
    }
    .amount-box {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,215,0,0.15);
      border: 1px solid rgba(255,215,0,0.4);
      font-size: 18px;
      font-weight: bold;
      color: gold;
      margin-top: 10px;
    }
    .camera-btn {
      background: black;
      color: white;
      padding: 10px;
      border-radius: 10px;
      width: 100%;
      margin-top: 10px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
      display: none;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      outline: 0;
    }
    .modal.show {
      display: block;
    }
    .modal-dialog {
      max-width: 500px;
      margin: 80px auto;
      pointer-events: none;
    }
    .modal-content {
      pointer-events: auto;
    }
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9998;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    .modal-backdrop.show {
      opacity: .5;
    }
  </style>
  <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body>

<div class="container container-box">

  <div class="card-box">

    <h3 >ADD MEMBER</h3>

    <input id="name" placeholder="Enter Name">
    <input
      id="phone"
      type="tel"
      maxlength="10"
      placeholder="Enter Phone"
      oninput="this.value=this.value.replace(/[^0-9]/g,'')"
    >
    <input
      id="age"
      type="number"
      min="10"
      max="80"
      placeholder="Enter Age"
    >

    <input
      id="weight"
      type="number"
      min="0"
      max="130"
      placeholder="Weight (kg)"
    >
    <input
      type="datetime-local"
      id="joinDate"
    >
    

    <select id="gender">
      <option>Male</option>
      <option>Female</option>
    </select>

    <select id="workoutType" onchange="calcPrice()">
      <option value="STRENGTH">Strength</option>
      <option value="CARDIO">Cardio</option>
      <option value="BOTH">Strength + Cardio</option>
    </select>

    <select id="plan" onchange="calcPrice()">
      <option value="1">1 Month</option>
      <option value="3">3 Months</option>
      <option value="6">6 Months</option>
      <option value="12">1 Year</option>
    </select>

    <!-- PHOTO -->
    <div class="photo-frame">
      <video id="video" autoplay></video>
      <img id="preview" style="display:none;">
    </div>

    <button type="button" class="camera-btn" onclick="openCamera()">📸 Open Camera</button>
    <button type="button" class="camera-btn" onclick="capturePhoto()">📷 Capture Photo</button>

    <!-- AMOUNT (FIXED POSITION) -->
    <div class="amount-box">
      💰 Amount: ₹<span id="price">0</span>
    </div>

    <select id="paymentMode">
      <option value="UPI">UPI</option>
      <option value="CASH">CASH</option>
    </select>

    <button
      type="button"
      class="btn-gold"
      onclick="submitMember(event)">
      SAVE MEMBER
    </button>

  </div>

</div>

<nav class="bottom-nav">
  <a href="dashboard.html"><span>⌂</span>Home</a>
  <a href="members.html"><span>☷</span>Members</a>
  <a class="add-action active-link" href="add-member.html"><span>+</span></a>
  <a href="expiry.html"><span>◴</span>Expiry</a>
  <a href="dashboard.html#transactionBox"><span>≡</span>More</a>
</nav>



<!-- SUCCESS MODAL -->

<div class="modal fade" id="successModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content bg-dark text-white border-warning">

      <div class="modal-header">

        <h5
          class="modal-title text-warning fw-bold"
          id="successTitle">
          Member Added Successfully
        </h5>

      </div>

      <div class="modal-body text-center">

        <p id="successMessage">
          Member has been added successfully.
        </p>

        <button
        type="button"
          id="invoiceBtn"
          class="btn btn-warning w-100 mb-2">

          📄 Download Invoice

        </button>

        <button
          type="button"
          id="whatsappBtn"
          class="btn btn-success w-100 mb-2">

          💬 WhatsApp

        </button>

        <button
          type="button"
          id="goBtn"
          class="btn btn-primary w-100">

          👥 Go To Members List

        </button>

      </div>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let stream;
let capturedFile = null;
let isSubmitting = false;



/* AUTO DATE */


window.onload = function () {
  const now = new Date();
  const localDateTime =
      now.getFullYear() + "-" +
      String(now.getMonth() + 1).padStart(2, "0") + "-" +
      String(now.getDate()).padStart(2, "0") + "T" +
      String(now.getHours()).padStart(2, "0") + ":" +
      String(now.getMinutes()).padStart(2, "0");
  document.getElementById("joinDate").value = localDateTime;
  calcPrice();

  // =========================
  // RENEW MEMBER AUTO FILL
  // =========================

  const renewData =
    JSON.parse(
      sessionStorage.getItem(
        "renewMember"
      )
    );

  if(renewData){
    document.querySelector("h3").innerText = "RENEW MEMBER";

    document.getElementById("name").value =
      renewData.name || "";

    document.getElementById("phone").value =
      renewData.phone || "";

    document.getElementById("age").value =
      renewData.age || "";

    document.getElementById("weight").value =
      renewData.weight || "";

    document.getElementById("gender").value =
      renewData.gender || "Male";

    document.getElementById("workoutType").value =
      renewData.workoutType || "STRENGTH";

    document.getElementById("plan").value =
      renewData.plan || "1";

    // SHOW OLD PHOTO

    document.getElementById("preview").src =
      renewData.photoUrl ||
      ("https://gym-management-system-bjcd.onrender.com" + renewData.photo);

    document.getElementById("preview").style.display =
      "block";

    document.getElementById("video").style.display =
      "none";

    calcPrice();
  }

};



/* CAMERA */
async function openCamera() {

  stream = await navigator.mediaDevices.getUserMedia({
    video: true
  });

  document.getElementById("video").srcObject = stream;
}

function capturePhoto() {

  const video = document.getElementById("video");

  const canvas = document.createElement("canvas");

  canvas.width = 300;
  canvas.height = 400;

  const ctx = canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.toBlob(blob => {

    capturedFile = new File(
      [blob],
      "photo.jpg",
      { type: "image/jpeg" }
    );

    document.getElementById("preview").src =
      URL.createObjectURL(blob);

    document.getElementById("preview").style.display = "block";

    document.getElementById("video").style.display = "none";

  });
}

/* PRICE */
function calcPrice() {

  const workout =
    document.getElementById("workoutType").value;

  const months =
    parseInt(
      document.getElementById("plan").value || 1
    );

  let base = 0;

  if (workout === "STRENGTH") base = 800;
  else if (workout === "CARDIO") base = 1000;
  else if (workout === "BOTH") base = 1500;

  const total = base * months;

  document.getElementById("price").innerText = total;
}

/* SAVE MEMBER */

async function submitMember(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  if (isSubmitting) {
    return false;
  }

  isSubmitting = true;

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const age = document.getElementById("age").value.trim();
  const weight = document.getElementById("weight").value.trim();

  if (!name) {
    isSubmitting = false;
    alert("Please enter Name");
    return;
  }

  if (!phone) {
    isSubmitting = false;
    alert("Please enter Phone Number");
    return;
  }

  if (!age) {
    isSubmitting = false;
    alert("Please enter Age");
    return;
  }

  if (!weight) {
    isSubmitting = false;
    alert("Please enter Weight");
    return;
  }

  const renewData = JSON.parse(sessionStorage.getItem("renewMember"));

  if (!capturedFile && !renewData) {
    isSubmitting = false;
    alert("Please capture Photo");
    return;
  }

  if (!/^[0-9]{10}$/.test(phone)) {
    isSubmitting = false;
    alert("Phone number must be exactly 10 digits");
    return;
  }

  if (Number(age) < 10 || Number(age) > 80) {
    isSubmitting = false;
    alert("Age must be between 10 and 80");
    return;
  }

  if (Number(weight) < 0 || Number(weight) > 130) {
    isSubmitting = false;
    alert("Weight must be between 0 and 130");
    return;
  }

  const formData = new FormData();

  formData.append("name", name);
  formData.append("phone", phone);
  formData.append("age", age);
  formData.append("weight", weight);
  formData.append("joinDate", document.getElementById("joinDate").value);
  formData.append("gender", document.getElementById("gender").value);
  formData.append("workoutType", document.getElementById("workoutType").value);
  formData.append("plan", document.getElementById("plan").value);
  formData.append("paymentMode", document.getElementById("paymentMode").value);

  if (capturedFile) {
    formData.append("photo", capturedFile);
  }

  if (renewData) {
    formData.append("existingPhoto", renewData.photo);
  }

  try {

    let res;

    if (renewData) {

      res = await fetch(
        `https://gym-management-system-bjcd.onrender.com/api/members/${renewData._id}/renew`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            plan: document.getElementById("plan").value,
            joinDate: document.getElementById("joinDate").value,
            paymentMode: document.getElementById("paymentMode").value
          })
        }
      );

    } else {

      res = await fetch(
        "https://gym-management-system-bjcd.onrender.com/api/members",
        {
          method: "POST",
          body: formData
        }
      );
    }

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.message || "Failed");
    }

    sessionStorage.removeItem("renewMember");

    showCustomSuccessPopup(
      data.member || data,
      !!renewData,
      data.invoice
    );

    isSubmitting = false;

    return false;

  } catch (err) {

    isSubmitting = false;

    console.error("SAVE MEMBER ERROR =", err);

    alert(err.message);
  }
}


function formatDisplayDate(value) {
  const date = value ? new Date(value) : new Date();

  if (Number.isNaN(date.getTime())) {
    return "-";
  }

  return date.toLocaleDateString("en-GB");
}

// Show modal function
function showCustomSuccessPopup(member, isRenew = false, invoiceFromResponse = "") {
  const modalEl = document.getElementById("successModal");

  if (!modalEl) {
    console.error("Success modal not found");
    return;
  }

  const invoiceUrl =
    invoiceFromResponse ||
    member.invoice ||
    `https://gym-management-system-bjcd.onrender.com/invoices/${member._id}.pdf`;

  document.getElementById("successTitle").innerText =
    isRenew ? "Membership Renewed Successfully" : "Member Added Successfully";

  document.getElementById("successMessage").innerText =
    isRenew
      ? "Membership renewed successfully. You can send the receipt and invoice link on WhatsApp."
      : "Member added successfully. You can send the welcome message and invoice link on WhatsApp.";

  const phone =
    member.phone ||
    document.getElementById("phone").value;

  const planMonths =
    parseInt(document.getElementById("plan").value || member.plan || 1);

  const workoutType =
    member.workoutType ||
    document.getElementById("workoutType").value;

  const planName = `${workoutType} - ${planMonths} Month${planMonths > 1 ? "s" : ""}`;
  const startDateText = formatDisplayDate(member.startDate || document.getElementById("joinDate").value);
  const expiryDateText = formatDisplayDate(member.endDate);
  const amount = member.amount || document.getElementById("price").innerText || "0";

  const whatsappMessage = isRenew
    ? `Hello ${member.name || "Member"},

Your Veer Fitness Club membership has been renewed successfully.

Renewal Details:
Plan: ${planName}
Start Date: ${startDateText}
Expiry Date: ${expiryDateText}
Amount Paid: Rs. ${amount}

Invoice PDF:
${invoiceUrl}

Thank you for continuing your fitness journey with us. Stay consistent and keep training strong.`
    : `Welcome to Veer Fitness Club, ${member.name || "Member"}!

Your membership has been created successfully.

Membership Details:
Plan: ${planName}
Start Date: ${startDateText}
Expiry Date: ${expiryDateText}
Amount Paid: Rs. ${amount}

Invoice PDF:
${invoiceUrl}

Please keep this invoice for your records. We are happy to have you with us.`;

  window._waPhone = phone;
  window._waMessage = whatsappMessage;

  document.getElementById("whatsappBtn").onclick = function(){
    const encodedMessage = encodeURIComponent(window._waMessage);
    const whatsappURL = `https://wa.me/91${window._waPhone}?text=${encodedMessage}`;
    window.open(whatsappURL, "_blank");
  };

  document.getElementById("invoiceBtn").onclick = function(){
    window.open(invoiceUrl, "_blank");
  };

  const oldBackdrop = document.getElementById("successModalBackdrop");

  if (oldBackdrop) {
    oldBackdrop.remove();
  }

  const backdrop = document.createElement("div");
  backdrop.id = "successModalBackdrop";
  backdrop.className = "modal-backdrop show";
  document.body.appendChild(backdrop);

  modalEl.style.display = "block";
  modalEl.classList.add("show");
  modalEl.removeAttribute("aria-hidden");
  modalEl.setAttribute("aria-modal", "true");
  modalEl.setAttribute("role", "dialog");
  document.body.classList.add("modal-open");

  document.getElementById("goBtn").onclick = function () {
    modalEl.style.display = "none";
    modalEl.classList.remove("show");
    modalEl.removeAttribute("aria-modal");
    modalEl.removeAttribute("role");
    document.body.classList.remove("modal-open");
    backdrop.remove();
    location.href = "./members.html";
  };

}


</script>
</body>
</html>
