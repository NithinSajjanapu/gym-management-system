<!DOCTYPE html>
<html>

<head>
    <title>Add Member</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body class="add-member-page">

    <!-- MAIN CONTAINER -->
    <div class="container container-box">

        <!-- FORM CARD -->
        <div class="card-box">

            <!-- TITLE -->
            <h3>ADD MEMBER</h3>

            <!-- BASIC DETAILS -->
            <input id="name" placeholder="Enter Name">

            <input
                id="phone"
                type="tel"
                maxlength="10"
                placeholder="Enter Phone"
                oninput="this.value=this.value.replace(/[^0-9]/g,'')"
            >

            <input
                id="age"
                type="number"
                min="10"
                max="80"
                placeholder="Enter Age"
            >

            <input
                id="weight"
                type="number"
                min="0"
                max="130"
                placeholder="Weight (kg)"
            >

            <input type="datetime-local" id="joinDate">

            <!-- GENDER -->
            <select id="gender">
                <option>Male</option>
                <option>Female</option>
            </select>

            <!-- WORKOUT TYPE -->
            <select id="workoutType" onchange="calcPrice()">
                <option value="STRENGTH">Strength</option>
                <option value="CARDIO">Cardio</option>
                <option value="BOTH">Strength + Cardio</option>
            </select>

            <!-- PLAN -->
            <select id="plan" onchange="calcPrice()">
                <option value="1">1 Month</option>
                <option value="3">3 Months</option>
                <option value="6">6 Months</option>
                <option value="12">1 Year</option>
            </select>

            <!-- PHOTO -->
            <div class="photo-frame">
                <video id="video" autoplay></video>
                <img id="preview" style="display:none;">
            </div>

            <!-- CAMERA ACTIONS -->
            <button type="button" class="camera-btn" onclick="openCamera()">📸 Open Camera</button>
            <button type="button" class="camera-btn" onclick="capturePhoto()">📷 Capture Photo</button>

            <!-- PRICE -->
            <div class="amount-box">
                💰 Amount: ₹<span id="price">0</span>
            </div>

            <!-- PAYMENT -->
            <select id="paymentMode">
                <option value="UPI">UPI</option>
                <option value="CASH">CASH</option>
            </select>

            <!-- SAVE -->
            <button type="button" class="btn-gold" onclick="submitMember(event)">
                SAVE MEMBER
            </button>

        </div>

    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <a href="dashboard.html"><span>⌂</span>Home</a>
        <a href="members.html"><span>☷</span>Members</a>
        <a class="add-action active-link" href="add-member.html"><span>+</span></a>
        <a href="expiry.html"><span>◴</span>Expiry</a>
        <a href="dashboard.html#transactionBox"><span>≡</span>More</a>
    </nav>

    <!-- SUCCESS MODAL -->
    <div class="modal fade" id="successModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="successTitle">
                        Member Added Successfully
                    </h5>
                </div>

                <div class="modal-body text-center">

                    <p id="successMessage">
                        Member has been added successfully.
                    </p>

                    <button type="button" id="invoiceBtn" class="btn btn-warning w-100 mb-2">
                        📄 Download Invoice
                    </button>

                    <button type="button" id="whatsappBtn" class="btn btn-success w-100 mb-2">
                        💬 WhatsApp
                    </button>

                    <button type="button" id="goBtn" class="btn btn-primary w-100">
                        👥 Go To Members List
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    //Token 
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "login.html";
        throw new Error("Unauthorixed");
    }

    //Global State

    let stream;
    let capturedFile = null;
    let isSubmitting = false;


    //Auto date + checking review

    window.onload = function () {

        const now = new Date();

        const localDateTime =
            now.getFullYear() + "-" +
            String(now.getMonth() + 1).padStart(2, "0") + "-" +
            String(now.getDate()).padStart(2, "0") + "T" +
            String(now.getHours()).padStart(2, "0") + ":" +
            String(now.getMinutes()).padStart(2, "0");

        document.getElementById("joinDate").value = localDateTime;

        calcPrice();

        const renewData = JSON.parse(sessionStorage.getItem("renewMember"));

        if (renewData) {

            document.querySelector("h3").innerText = "RENEW MEMBER";

            document.getElementById("name").value = renewData.name || "";
            document.getElementById("phone").value = renewData.phone || "";
            document.getElementById("age").value = renewData.age || "";
            document.getElementById("weight").value = renewData.weight || "";
            document.getElementById("gender").value = renewData.gender || "Male";
            document.getElementById("workoutType").value = renewData.workoutType || "STRENGTH";
            document.getElementById("plan").value = renewData.plan || "1";

            document.getElementById("preview").src =
                renewData.photoUrl ||
                ("https://gym-management-system-bjcd.onrender.com" + renewData.photo);

            document.getElementById("preview").style.display = "block";
            document.getElementById("video").style.display = "none";

            calcPrice();
        }
    };


    //Camera function

    async function openCamera() {

        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } }
        });

        document.getElementById("video").srcObject = stream;
    }

    function capturePhoto() {

        const video = document.getElementById("video");
        const canvas = document.createElement("canvas");

        canvas.width = 300;
        canvas.height = 400;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {

            capturedFile = new File([blob], "photo.jpg", { type: "image/jpeg" });

            document.getElementById("preview").src = URL.createObjectURL(blob);
            document.getElementById("preview").style.display = "block";
            document.getElementById("video").style.display = "none";
        });
    }

    //Price calculation

    function calcPrice() {

        const workout = document.getElementById("workoutType").value;
        const plan = document.getElementById("plan").value;

        let total = 0;

        if (workout === "STRENGTH") {
            if (plan === "1") total = 1249;
            else if (plan === "3") total = 2999;
            else if (plan === "6") total = 5499;
            else if (plan === "12") total = 9999;
        }

        else if (workout === "CARDIO") {
            if (plan === "1") total = 1499;
            else if (plan === "3") total = 3499;
            else if (plan === "6") total = 6499;
            else if (plan === "12") total = 10999;
        }

        else if (workout === "BOTH") {
            if (plan === "1") total = 1799;
            else if (plan === "3") total = 4499;
            else if (plan === "6") total = 7999;
            else if (plan === "12") total = 12999;
        }

        document.getElementById("price").innerText = total;
    }

    //Submit member function

    async function submitMember(event) {

        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        if (isSubmitting) return false;
        isSubmitting = true;

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const age = document.getElementById("age").value.trim();
        const weight = document.getElementById("weight").value.trim();

        if (!name || !phone || !age || !weight) {
            isSubmitting = false;
            alert("Please fill all fields");
            return;
        }

        const renewData = JSON.parse(sessionStorage.getItem("renewMember"));

        if (!capturedFile && !renewData) {
            isSubmitting = false;
            alert("Please capture Photo");
            return;
        }

        if (!/^[0-9]{10}$/.test(phone)) {
            isSubmitting = false;
            alert("Invalid phone number");
            return;
        }

        if (Number(age) < 10 || Number(age) > 80) {
            isSubmitting = false;
            alert("Invalid age");
            return;
        }

        if (Number(weight) < 0 || Number(weight) > 130) {
            isSubmitting = false;
            alert("Invalid weight");
            return;
        }

        const formData = new FormData();

        formData.append("name", name);
        formData.append("phone", phone);
        formData.append("age", age);
        formData.append("weight", weight);
        formData.append("joinDate", document.getElementById("joinDate").value);
        formData.append("gender", document.getElementById("gender").value);
        formData.append("workoutType", document.getElementById("workoutType").value);
        formData.append("plan", document.getElementById("plan").value);
        formData.append("paymentMode", document.getElementById("paymentMode").value);

        if (capturedFile) formData.append("photo", capturedFile);
        if (renewData) formData.append("existingPhoto", renewData.photo);

        try {

            let res;

            if (renewData) {

                res = await fetch(
                    `https://gym-management-system-bjcd.onrender.com/api/members/${renewData._id}/renew`,
                    {
                        method: "POST",
                        headers: {
                                "Content-Type": "application/json",
                                Authorization: `Bearer ${token}`
                                },
                        body: JSON.stringify({
                            plan: document.getElementById("plan").value,
                            joinDate: document.getElementById("joinDate").value,
                            paymentMode: document.getElementById("paymentMode").value
                        })
                    }
                );

            } else {

                res = await fetch(
                    "https://gym-management-system-bjcd.onrender.com/api/members",
                    {
                        method:"POST",
                        headers:{
                            Authorization:`Bearer ${token}`
                        },
                        body:formData
                    }
                );
            }

            const data = await res.json();

            if (!res.ok) throw new Error(data.message || "Failed");

            sessionStorage.removeItem("renewMember");

            showCustomSuccessPopup(data.member || data, !!renewData, data.invoice);

            isSubmitting = false;

        } catch (err) {
            isSubmitting = false;
            alert(err.message);
        }
    }

    //Sucess modal after save member

    function showCustomSuccessPopup(member, isRenew, invoiceFromResponse) {

        const modalEl = document.getElementById("successModal");

        const invoiceUrl =
            invoiceFromResponse ||
            member.invoice ||
            `https://gym-management-system-bjcd.onrender.com/invoices/${member._id}.pdf`;

        document.getElementById("successTitle").innerText =
            isRenew ? "Membership Renewed Successfully" : "Member Added Successfully";

        document.getElementById("successMessage").innerText =
            isRenew
                ? "Membership renewed successfully."
                : "Member added successfully.";

        const phone = member.phone || document.getElementById("phone").value;

        const planMonths = parseInt(document.getElementById("plan").value || member.plan || 1);
        const workoutType = document.getElementById("workoutType").value;

        const planName = `${workoutType} - ${planMonths} Month`;

        const msg =
            isRenew
                ? `Renewed ${planName}`
                : `Welcome ${planName}`;

        document.getElementById("whatsappBtn").onclick = () => {
            window.open(`https://wa.me/91${phone}?text=${encodeURIComponent(msg)}`);
        };

        document.getElementById("invoiceBtn").onclick = () => {
            window.open(invoiceUrl);
        };

        document.getElementById("goBtn").onclick = () => {
            location.href = "./members.html";
        };

        modalEl.style.display = "block";
        modalEl.classList.add("show");
    }

    </script>

</body>
</html>
