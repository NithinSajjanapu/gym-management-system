<!DOCTYPE html>
<html>
<head>
  <title>Veer Fitness Club - Login</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      margin: 0;
      height: 100vh;
      font-family: Arial;

      /* REAL GYM BACKGROUND */
      background: url("https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* dark overlay for readability */
    .overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
    }

    /* center container */
    .center {
      position: relative;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      padding: 20px;
    }

    /* login box */
    .login-box {
      width: 100%;
      max-width: 420px;

      padding: 35px;
      border-radius: 18px;

      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);

      border: 1px solid rgba(255,215,0,0.3);

      box-shadow: 0 0 30px rgba(255,215,0,0.2);
    }

    h2 {
      text-align: center;
      color: gold;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #ddd;
      font-size: 13px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;

      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);

      background: rgba(0,0,0,0.4);
      color: white;

      outline: none;
    }

    input:focus {
      border: 1px solid gold;
      box-shadow: 0 0 10px gold;
    }

    button {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 10px;

      background: linear-gradient(45deg, #ffcc00, #ff8800);
      font-weight: bold;
      color: black;

      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px gold;
    }

    .icons {
      text-align: center;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .error {
      color: #ff4d4d;
      text-align: center;
      margin-top: 10px;
    }

    /* MOBILE RESPONSIVE */
    @media (max-width: 600px) {
      .login-box {
        padding: 25px;
        width: 90%;
      }

      h2 {
        font-size: 22px;
      }
    }

  </style>
  <link href="../assets/css/style.css" rel="stylesheet">
</head>

<body>

<div class="overlay"></div>

<div class="center">

  <div class="login-box">

    <h2>VEER FITNESS CLUB</h2>
    <div class="subtitle">Where Grit Meets Greatness</div>

    <div class="icons">Wellcome Boss</div>

    <input id="email" placeholder="Enter Email">
    <input id="password" type="password" placeholder="Enter Password">

    <button onclick="login()">LOGIN</button>

    <div id="msg" class="error"></div>

  </div>

</div>

<script>

async function login() {

  const username = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!username || !password) {
    document.getElementById("msg").innerText = "Please fill all fields";
    return;
  }

  try {

    const res = await fetch("http://localhost:5000/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (res.ok && data.token) {

      localStorage.setItem("token", data.token);

      document.getElementById("msg").style.color = "green";
      document.getElementById("msg").innerText = "Login Successful... Redirecting";

      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1000);

    } else {
      document.getElementById("msg").style.color = "red";
      document.getElementById("msg").innerText = data.message || "Invalid Credentials";
    }

  } catch (error) {
    document.getElementById("msg").style.color = "red";
    document.getElementById("msg").innerText = "Server not reachable";
  }
}


</script>

</body>
</html>
